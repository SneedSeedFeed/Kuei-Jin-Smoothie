  NUMINA_ALCHEMY_5_PERK_EFFECT: "Improves all [GetPerk('numina_alchemy_4_perk').GetName(GetPlayer)] $pod_crafting_nodes$\n$unlock_brewing_node$ #TOOLTIP:GAME_TRAIT,immortal,[GetNullCharacter] #L Immortality#!\n$unlock_brewing_node$ #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L Vampirism#!\n$unlock_brewing_node$ [GetModifier('kueijin_smoothie_modifier_5').GetNameWithTooltip]\n#flavor The Alchemist can create substances that mimick the effects of mid-level supernatural abilities. However, these potions can have nasty side effects depending on how potent the concoction is made, and require studying the supernatural subject as well as getting reagents from them. Materials such as wolf fur, vampire blood, fairy blood etc. in order to produce the potion. #!"